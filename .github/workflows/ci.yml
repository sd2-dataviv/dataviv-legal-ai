name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataviv
          POSTGRES_PASSWORD: dataviv_dev_only
          POSTGRES_DB: dataviv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataviv" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: dataviv_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Prepare database roles
        run: psql -h localhost -U dataviv -d dataviv -f ../docker/postgres/init.sql
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Test (includes permission-leak and RLS suites)
        run: pytest --cov=app --cov-report=term-missing
