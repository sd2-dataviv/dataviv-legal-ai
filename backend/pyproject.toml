[project]
name = "dataviv-ai-os"
version = "0.4.0"
description = "Dataviv AI OS — legal AI operating system (Vault, Assistant, Workflows, Agents)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "tqdm>=4.66",
    "pypdf>=5.0",   # pure-Python PDF text extraction (works under Smart App Control)
    "httpx>=0.27",  # OCR service and model provider (Groq) client
    # Live co-editing of drafts (Yjs CRDT). Compiled (Rust): if Windows Smart App Control blocks it, the API
    # still runs and drafts fall back to versioned saves (ADR-020).
    "pycrdt>=0.12",
    # RS256 signing of the DocuSign JWT-grant assertion (e-signature, Step 2e). Imported only when
    # DATAVIV_ESIGN_BACKEND=docusign, so the API still starts where it cannot load.
    "cryptography>=42",
]

[project.optional-dependencies]
# In-process bge-m3 embeddings (DATAVIV_EMBEDDINGS_BACKEND=local). Linux/macOS; install CPU PyTorch first
# (bash scripts/linux/setup.sh --semantic does both). Not needed for the http backend (TEI).
local-embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx-ws>=0.7",  # WebSocket tests in-process (live drafts)
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "E501"]   # assert in tests; FastAPI Depends(); line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
