# Local development stack. `make up` starts it; `make down` stops it.
# Step 0 needs only postgres. The others are here so later steps work without edits.
name: dataviv-ai-os

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dataviv
      POSTGRES_PASSWORD: dataviv_dev_only
      POSTGRES_DB: dataviv
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataviv -d dataviv"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:            # Step 1 — vectors with ACL payload filters
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    profiles: [ai]

  minio:             # Step 1 — document originals (S3-compatible)
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dataviv
      MINIO_ROOT_PASSWORD: dataviv_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    profiles: [ai]

  redis:
    image: redis:7
    ports: ["6379:6379"]
    profiles: [ai]

  temporal:          # Step 4 — durable workflows and agent runs
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: dataviv
      POSTGRES_PWD: dataviv_dev_only
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [workflows]

volumes:
  pgdata:
  qdrant:
  minio:
